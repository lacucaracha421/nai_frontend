[package]
name = "nai-frontend"
version = "0.2.0"
description = "Personal NovelAI desktop frontend prototype"
authors = ["local"]
edition = "2021"

[lib]
name = "nai_frontend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
