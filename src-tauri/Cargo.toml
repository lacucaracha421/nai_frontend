[package]
name="nai-frontend"
version="0.4.8"
description="Galaxy Tab S11 portrait-first NovelAI Diffusion V5 frontend"
authors= ["local"]
edition="2021"

[lib]
name="nai_frontend_lib"
crate-type= ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build= {version="2", features = [] }

[dependencies]
tauri= {version="2",features= ["protocol-asset"] }
serde= {version="1",features= ["derive"] }
serde_json="1"
reqwest= {version="0.12",default-features=false,features= ["json", "rustls-tls", "multipart"] }
rusqlite= {version="0.40",default-features=false,features= ["bundled"] }
flate2="1"
tauri-plugin-fs="2"
tauri-plugin-dialog="2"
zip= {version="4",default-features=false,features= ["deflate"] }
base64="0.22"
keyring-core="1"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store="1.0.0"
jni="0.21.1"
ndk-context="0.1.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store= {version="1.1.0",default-features=false}
