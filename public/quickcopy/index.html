<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Artist / Tag Quick Copy v7</title>
<style>
:root {
  color-scheme: dark;
  --bg:#0f1115;
  --panel:#171a20;
  --panel-2:#1d2128;
  --panel-3:#222730;
  --line:#2a3039;
  --line-soft:#232932;
  --text:#f3f5f7;
  --muted:#969eaa;
  --muted-2:#68717d;
  --danger:#ff7777;
  --shadow:0 18px 60px rgba(0,0,0,.36);
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
button,input,textarea { font:inherit; }
button { color:inherit; }
.app {
  width:min(1180px,calc(100% - 32px));
  margin:34px auto 80px;
}
.topbar {
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin-bottom:16px;
}
.title-wrap h1 {
  margin:0 0 5px;
  font-size:22px;
  letter-spacing:-.025em;
}
.subtitle {
  color:var(--muted);
  font-size:13px;
}
.toolbar {
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}
.btn {
  appearance:none;
  border:1px solid var(--line);
  background:var(--panel-2);
  color:var(--text);
  border-radius:10px;
  padding:9px 13px;
  font-size:13px;
  cursor:pointer;
}
.btn:hover { background:#252b34; }
.btn.primary {
  background:#f3f4f6;
  color:#111318;
  border-color:#f3f4f6;
  font-weight:750;
}
.btn.primary:hover { background:#fff; }

.tabs {
  display:flex;
  gap:8px;
  margin-bottom:12px;
}
.tab {
  appearance:none;
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  border-radius:10px;
  padding:9px 14px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}
.tab.active {
  color:var(--text);
  background:var(--panel-2);
  border-color:#3a424e;
}

.controls {
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:12px;
}
.search {
  flex:1;
  min-width:0;
  border:1px solid var(--line);
  background:#13161b;
  color:var(--text);
  border-radius:10px;
  padding:10px 12px;
  outline:none;
}
.search:focus { border-color:#586271; }
.search::placeholder { color:#626b77; }

.category-strip {
  display:none;
  gap:7px;
  overflow:auto;
  scrollbar-width:thin;
  padding-bottom:2px;
}
.category-strip.show { display:flex; }
.cat-btn {
  flex:0 0 auto;
  appearance:none;
  border:1px solid var(--line);
  background:#15181d;
  color:var(--muted);
  border-radius:999px;
  padding:7px 11px;
  font-size:12px;
  cursor:pointer;
}
.cat-btn.active {
  color:#111318;
  background:#f3f4f6;
  border-color:#f3f4f6;
  font-weight:750;
}

.section-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:15px 2px 8px;
}
.section-title {
  font-size:12px;
  color:var(--muted);
  font-weight:750;
  letter-spacing:.02em;
}
.section-count {
  color:var(--muted-2);
  font-size:11px;
}

.sheet {
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:14px;
  overflow:hidden;
}
.artist-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
}
.artist-row {
  min-height:62px;
  display:grid;
  grid-template-columns:38px minmax(145px,1fr) minmax(120px,.82fr);
  align-items:stretch;
  border-bottom:1px solid var(--line);
}
.artist-row:nth-child(odd) { border-right:1px solid var(--line); }
.artist-row.pinned { background:rgba(255,255,255,.018); }
.idx {
  display:flex;
  align-items:center;
  padding-left:15px;
  color:#768092;
  font-size:11px;
  user-select:none;
  font-variant-numeric:tabular-nums;
}
.artist-name-cell {
  min-width:0;
  display:flex;
  align-items:center;
  padding:0 12px 0 4px;
  cursor:pointer;
  user-select:none;
}
.artist-name-cell:hover { background:var(--panel-2); }
.artist-name {
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:14px;
  font-weight:700;
}
.pin {
  flex:0 0 auto;
  margin-left:7px;
  color:#b7bfcc;
  font-size:10px;
  letter-spacing:.04em;
}
.note-wrap {
  min-width:0;
  display:flex;
  align-items:center;
  padding:8px 9px;
  border-left:1px solid var(--line-soft);
  background:rgba(255,255,255,.01);
}
.inline-note {
  width:100%;
  min-width:0;
  border:1px solid transparent;
  background:transparent;
  color:#c9ced5;
  border-radius:8px;
  padding:8px 9px;
  outline:none;
  font-size:12px;
}
.inline-note::placeholder { color:#59616c; }
.inline-note:hover {
  background:#14171c;
  border-color:#252b33;
}
.inline-note:focus {
  background:#111318;
  border-color:#56606e;
  color:var(--text);
}

.action-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.action-card {
  min-width:0;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:13px;
  padding:13px 14px 12px;
  cursor:pointer;
  user-select:none;
  transition:background .12s ease,border-color .12s ease,transform .12s ease;
}
.action-card:hover {
  background:var(--panel-2);
  border-color:#3a424e;
}
.action-card:active { transform:translateY(1px); }
.action-card.pinned { border-color:#444d5b; }
.action-top {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
}
.action-title-wrap {
  min-width:0;
  display:flex;
  align-items:center;
}
.action-title {
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:14px;
  font-weight:780;
}
.badge {
  flex:0 0 auto;
  max-width:130px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  border:1px solid #343b46;
  background:#15191f;
  color:#aeb6c2;
  border-radius:999px;
  padding:4px 8px;
  font-size:10px;
}
.prompt-preview {
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:36px;
  color:#d8dce2;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:12px;
  line-height:1.5;
  word-break:break-word;
}
.action-note {
  margin-top:9px;
  color:#808a97;
  font-size:11px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.action-note:empty { display:none; }

.empty {
  padding:42px 18px;
  text-align:center;
  color:var(--muted);
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:14px;
}
.hint {
  margin-top:10px;
  color:var(--muted);
  font-size:12px;
  text-align:right;
}

.menu {
  position:fixed;
  z-index:40;
  min-width:158px;
  padding:6px;
  border:1px solid var(--line);
  background:#20242b;
  border-radius:10px;
  box-shadow:var(--shadow);
  display:none;
}
.menu.show { display:block; }
.menu button {
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  text-align:left;
  padding:9px 10px;
  border-radius:7px;
  font-size:13px;
  cursor:pointer;
}
.menu button:hover { background:#2a3039; }
.menu button.danger { color:var(--danger); }

.toast {
  position:fixed;
  left:50%;
  bottom:26px;
  z-index:60;
  transform:translate(-50%,12px);
  opacity:0;
  pointer-events:none;
  background:#f3f4f6;
  color:#111318;
  border-radius:10px;
  padding:9px 13px;
  font-size:13px;
  font-weight:750;
  box-shadow:0 12px 36px rgba(0,0,0,.35);
  transition:.18s ease;
}
.toast.show {
  opacity:1;
  transform:translate(-50%,0);
}

dialog {
  width:min(540px,calc(100% - 28px));
  border:1px solid var(--line);
  border-radius:14px;
  background:#191d23;
  color:var(--text);
  padding:0;
  box-shadow:0 30px 100px rgba(0,0,0,.58);
}
dialog::backdrop { background:rgba(0,0,0,.62); }
.dialog-body { padding:20px; }
.dialog-title {
  font-size:17px;
  font-weight:780;
  margin-bottom:15px;
}
.field + .field { margin-top:12px; }
.label {
  display:block;
  margin:0 0 6px 2px;
  color:var(--muted);
  font-size:11px;
}
.dialog-input,
.dialog-textarea {
  width:100%;
  border:1px solid var(--line);
  background:#111419;
  color:var(--text);
  border-radius:9px;
  padding:11px 12px;
  outline:none;
}
.dialog-input:focus,
.dialog-textarea:focus { border-color:#606b7a; }
.dialog-textarea {
  min-height:150px;
  resize:vertical;
  line-height:1.45;
}
.dialog-actions {
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:16px;
}

@keyframes flash {
  0% { background:#3b424e; }
  100% { background:transparent; }
}
.flash { animation:flash .38s ease; }


.choice-list {
  display:flex;
  flex-direction:column;
  gap:8px;
}
.choice-row {
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:10px 11px;
  border:1px solid var(--line);
  background:#12161b;
  border-radius:9px;
  cursor:pointer;
}
.choice-row:hover { background:#171b21; }
.choice-row input {
  margin-top:3px;
  accent-color:#f3f4f6;
}
.choice-row span {
  display:flex;
  flex-direction:column;
  gap:3px;
}
.choice-row strong {
  font-size:13px;
  font-weight:750;
}
.choice-row small {
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
}
.import-summary {
  margin-bottom:14px;
  padding:10px 11px;
  border:1px solid var(--line);
  background:#12161b;
  border-radius:9px;
  color:#cbd1d9;
  font-size:12px;
  line-height:1.55;
}
select.dialog-input {
  appearance:auto;
}



/* Tag dictionary */
.combo-toggle {
  display:none;
  flex:0 0 auto;
  min-height:42px;
}
.combo-toggle.show { display:inline-flex; align-items:center; justify-content:center; }
.combo-toggle.active {
  background:#f3f4f6;
  color:#111318;
  border-color:#f3f4f6;
  font-weight:750;
}
.tag-card {
  min-width:0;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:13px;
  padding:13px 14px 12px;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
  transition:background .12s ease,border-color .12s ease,transform .12s ease;
}
.tag-card:hover { background:var(--panel-2); border-color:#3a424e; }
.tag-card:active { transform:translateY(1px); }
.tag-card.pinned { border-color:#444d5b; }
.tag-card.selected {
  border-color:#dfe4ea;
  box-shadow:inset 0 0 0 1px #dfe4ea;
  background:#20252c;
}
.tag-main {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:6px;
}
.tag-prompt-wrap { min-width:0; }
.tag-prompt {
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:14px;
  font-weight:780;
  color:#f3f5f7;
}
.tag-title {
  margin-top:4px;
  color:#aeb6c2;
  font-size:11px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.tag-description {
  color:#cbd1d9;
  font-size:12px;
  line-height:1.48;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:36px;
}
.tag-grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.combo-bar {
  position:fixed;
  left:50%;
  bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:50;
  width:min(1120px,calc(100% - 28px));
  transform:translateY(24px) translateX(-50%);
  opacity:0;
  pointer-events:none;
  border:1px solid #3b434e;
  background:rgba(24,28,34,.96);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-radius:14px;
  box-shadow:0 18px 60px rgba(0,0,0,.46);
  padding:10px;
  transition:opacity .14s ease,transform .14s ease;
}
.combo-bar.show {
  opacity:1;
  transform:translateY(0) translateX(-50%);
  pointer-events:auto;
}
.combo-bar-inner {
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}
.combo-chips {
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:thin;
  padding:2px 1px;
}
.combo-empty {
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
  padding:0 5px;
}
.combo-chip {
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  border:1px solid #3b434e;
  background:#111419;
  border-radius:999px;
  padding:5px 7px 5px 10px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:11px;
  color:#e5e8ec;
}
.combo-chip button {
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  background:#272d35;
  color:#d7dce2;
  cursor:pointer;
  padding:0;
}
.combo-actions {
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:7px;
}
.combo-count {
  color:var(--muted);
  font-size:11px;
  min-width:34px;
  text-align:right;
}
.combo-actions .btn { min-height:38px; padding:8px 10px; }
.combo-actions .btn:disabled { opacity:.42; cursor:default; }
body.combo-active .app { padding-bottom:104px; }
body.combo-active .toast { bottom:124px; }
.artist-name-cell,
.action-card {
  -webkit-touch-callout:none;
  touch-action:manipulation;
}

@media (max-width:860px) {
  .tag-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .tabs {
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    padding-bottom:2px;
  }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:0 0 auto; min-height:42px; }
  .cat-btn { min-height:40px; padding:8px 12px; }
}

@media (max-width:600px) {
  .tag-grid { grid-template-columns:1fr; }
  dialog {
    width:calc(100% - 16px);
    max-height:calc(100dvh - 20px);
    overflow:auto;
    border-radius:14px;
  }
  .dialog-body { padding:16px; }
  .dialog-input,
  .dialog-textarea,
  .search { font-size:16px; }
  .dialog-textarea { min-height:112px; }
  .dialog-actions {
    position:sticky;
    bottom:0;
    background:#191d23;
    padding-top:10px;
  }
  .menu button { min-height:44px; font-size:14px; }
  .combo-bar {
    width:calc(100% - 16px);
    bottom:calc(8px + env(safe-area-inset-bottom));
    padding:8px;
  }
  .combo-bar-inner { flex-direction:column; align-items:stretch; gap:8px; }
  .combo-chips { width:100%; min-height:36px; }
  .combo-actions { width:100%; }
  .combo-count { text-align:left; margin-right:auto; }
  .combo-actions .btn { min-height:42px; }
  body.combo-active .app { padding-bottom:154px; }
  body.combo-active .toast { bottom:174px; }
  .tag-card { padding:13px; min-height:104px; }
}

@media (max-width:860px) {
  .app {
    width:min(100% - 20px,1180px);
    margin-top:20px;
  }
  .topbar {
    flex-direction:column;
    align-items:flex-start;
  }
  .toolbar { width:100%; }
  .toolbar .btn { flex:1; }
  .artist-grid,
  .action-grid { grid-template-columns:1fr; }
  .artist-row:nth-child(odd) { border-right:0; }
}
@media (max-width:520px) {
  .artist-row {
    grid-template-columns:34px minmax(105px,1fr) minmax(94px,.85fr);
  }
  .idx { padding-left:10px; }
  .artist-name-cell { padding-right:7px; }
  .note-wrap { padding:7px 6px; }
  .controls { flex-direction:column; align-items:stretch; }
}


/* Galaxy Tab S11 portrait-first touch layout.
   1600x2560 physical pixels commonly maps close to an 800px CSS viewport at DPR 2. */
@media (min-width:601px) and (max-width:900px) and (orientation:portrait) {
  .app {
    width:min(100% - 28px,900px);
    margin-top:22px;
  }
  .title-wrap h1 { font-size:23px; }
  .subtitle { font-size:13px; }
  .toolbar { width:100%; gap:8px; }
  .toolbar .btn { min-height:44px; }
  .tabs { gap:8px; margin-bottom:14px; }
  .tab { min-height:46px; padding:10px 15px; font-size:14px; }
  .controls { gap:10px; margin-bottom:14px; }
  .search { min-height:48px; padding:11px 14px; font-size:15px; }
  .combo-toggle { min-height:48px; padding-inline:16px; }
  .category-strip { gap:8px; padding-bottom:4px; }
  .cat-btn { min-height:44px; padding:9px 14px; font-size:13px; }
  .tag-grid,
  .action-grid {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }
  .tag-card { min-height:118px; padding:15px 16px 14px; border-radius:14px; }
  .tag-prompt { font-size:15px; }
  .tag-title { margin-top:5px; font-size:12px; }
  .tag-description { font-size:13px; line-height:1.5; min-height:39px; }
  .action-card { min-height:112px; padding:15px 16px 14px; }
  .combo-bar {
    width:calc(100% - 28px);
    bottom:calc(12px + env(safe-area-inset-bottom));
    padding:11px;
  }
  .combo-bar-inner { gap:11px; }
  .combo-chips { min-height:42px; gap:7px; }
  .combo-chip { min-height:40px; padding:4px 6px 4px 11px; font-size:12px; }
  .combo-chip button { width:34px; height:34px; font-size:16px; }
  .combo-actions { gap:8px; }
  .combo-actions .btn { min-height:44px; padding:9px 12px; }
  body.combo-active .app { padding-bottom:116px; }
  body.combo-active .toast { bottom:136px; }
  dialog { width:min(620px,calc(100% - 32px)); max-height:calc(100dvh - 36px); }
  .dialog-input, .dialog-textarea { font-size:16px; }
  .menu button { min-height:46px; font-size:14px; }
}


/* NAI V5 embedded mode */
body.nai-embedded { padding-top: 0; }
body.nai-embedded .app {
  width: min(1180px, calc(100% - 24px));
  margin: 18px auto 72px;
}
@media (max-width: 700px) {
  body.nai-embedded .app { width: calc(100% - 18px); margin-top: 12px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title-wrap">
      <h1>Artist / Tag Quick Copy</h1>
      <div class="subtitle" id="subtitle"></div>
    </div>
    <div class="toolbar">
      <button class="btn" id="backupBtn">백업</button>
      <button class="btn" id="importBtn">불러오기</button>
      <button class="btn" id="resetBtn">초기화</button>
      <button class="btn primary" id="addBtn">+ 작가 추가</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="artists">작가 <span id="artistCountTab"></span></button>
    <button class="tab" data-tab="actions">행동·행위 <span id="actionCountTab"></span></button>
    <button class="tab" data-tab="tags">태그사전 <span id="tagCountTab"></span></button>
  </div>

  <div class="controls">
    <input class="search" id="searchInput" placeholder="작가명 또는 메모 검색..." autocomplete="off" />

const NAI_EMBEDDED = window.self !== window.top;
const NAI_BRIDGE_SOURCE = "artist-tag-quick-copy-v7";
if (NAI_EMBEDDED) document.body.classList.add("nai-embedded");
const LEGACY_KEY = "artist-quick-copy.v1";

const DEFAULT_DATA = {
  artists: DEFAULT_ARTISTS,
  actions: [],
  tags: DEFAULT_TAGS
};

let activeTab = "artists";

let activeCategory = "전체";

let targetType = null;
let targetIndex = -1;
let artistEditIndex = -1;
let actionEditIndex = -1;
let tagEditIndex = -1;
let comboMode = false;
let comboSelection = new Set();

const content = document.getElementById("content");
const subtitle = document.getElementById("subtitle");
const searchInput = document.getElementById("searchInput");

function normalizeArtist(item) {
  if (typeof item === "string") {
    return { name:item.trim(), note:"", pinned:false };
  }
  if (item && typeof item === "object") {
    return {
      name:String(item.name ?? "").trim(),
      note:String(item.note ?? ""),
      pinned:Boolean(item.pinned)
    };
  }
  return null;
}

function normalizeAction(item) {
  if (!item || typeof item !== "object") return null;
  return {
    title:String(item.title ?? "").trim(),
    category:String(item.category ?? "기타").trim() || "기타",
    prompt:String(item.prompt ?? "").trim(),
    note:String(item.note ?? ""),
    pinned:Boolean(item.pinned)
  };
}

function normalizeTag(item) {
  if (!item || typeof item !== "object") return null;
  return {
    title:String(item.title ?? "").trim(),
    category:String(item.category ?? "구도").trim() || "구도",
    prompt:String(item.prompt ?? "").trim(),
    description:String(item.description ?? "").trim(),
    aliases:String(item.aliases ?? "").trim(),
    note:String(item.note ?? ""),
    pinned:Boolean(item.pinned)
  };
}

function cloneDefaultData() {
  return {
    artists: DEFAULT_DATA.artists.map(x => ({...x})),
    actions: DEFAULT_DATA.actions.map(x => ({...x})),
    tags: DEFAULT_DATA.tags.map(x => ({...x}))
  };
}

function loadData() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && typeof saved === "object") {
      return {
        artists:Array.isArray(saved.artists) ? saved.artists.map(normalizeArtist).filter(x => x && x.name) : [],
        actions:Array.isArray(saved.actions) ? saved.actions.map(normalizeAction).filter(x => x && x.title && x.prompt) : [],
        tags:Array.isArray(saved.tags)
          ? saved.tags.map(normalizeTag).filter(x => x && x.title && x.prompt)
          : DEFAULT_TAGS.map(x => ({...x}))
      };
    }
  } catch {}

  // v1~v3 migration: old versions stored only the artist array.
  try {
    const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY));
    if (Array.isArray(legacy)) {
      const migrated = {
        artists:legacy.map(normalizeArtist).filter(x => x && x.name),
        actions:[],
        tags:DEFAULT_TAGS.map(x => ({...x}))
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
      return migrated;
    }
  } catch {}

  return cloneDefaultData();
}

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function orderedEntries(items) {
  return items
    .map((item,index) => ({item,index}))
    .sort((a,b) => Number(b.item.pinned) - Number(a.item.pinned));
}

function includesText(...values) {
  const q = searchText.trim().toLowerCase();
  if (!q) return true;
  return values.some(v => String(v ?? "").toLowerCase().includes(q));
}

function render() {

  document.getElementById("actionCountTab").textContent = `(${data.actions.length})`;

  document.querySelectorAll(".tab").forEach(btn => {

  if (activeTab === "artists") {

}

  categoryStrip.innerHTML = "";
  searchInput.placeholder = "작가명 또는 메모 검색...";
  document.getElementById("addBtn").textContent = "+ 작가 추가";
  subtitle.textContent = `${data.artists.length}명 · 작가명을 클릭하면 artist:이름 ${NAI_EMBEDDED ? "삽입" : "복사"}`;
  hint.textContent = "작가명 클릭: 복사 · 우클릭: 상단 고정 / 수정 / 삭제 · 메모: 입력 즉시 자동 저장";

  const filtered = orderedEntries(data.artists).filter(({item}) =>
    includesText(item.name,item.note)
  );

  if (!filtered.length) {
    content.innerHTML = `<div class="empty">${searchText ? "검색 결과가 없답니다." : "등록된 작가가 없답니다."}</div>`;
    return;

  const pinned = filtered.filter(x => x.item.pinned);
  const regular = filtered.filter(x => !x.item.pinned);

  if (pinned.length) {
    html += artistSectionHtml("고정", pinned);

  if (regular.length) {
    html += artistSectionHtml(pinned.length ? "전체" : "작가", regular);

  content.innerHTML = html;

  content.querySelectorAll(".artist-row").forEach(row => {
    const i = Number(row.dataset.index);

    bindPressable(nameCell,"artist",i,() => copyArtist(i,row));

  else comboSelection.add(index);

function renderComboBar() {
  const visible = activeTab === "tags" && comboMode;
  comboBar.classList.toggle("show", visible);
  document.body.classList.toggle("combo-active", visible);
  comboModeBtn.classList.toggle("active", visible);
  comboModeBtn.textContent = visible ? "조합 모드 켜짐" : "조합 모드";

  const selected = [...comboSelection]
    .filter(i => data.tags[i])

  comboChips.innerHTML = selected.length
    ? selected.map(({index,item}) => `
        <span class="combo-chip">

          <button type="button" data-remove-index="${index}" aria-label="${escapeAttr(item.prompt)} 제거">×</button>

async function copyTag(i,card) {
  const item = data.tags[i];
  if (!item) return;
  const ok = await copyText(item.prompt);
  card.classList.remove("flash");
  void card.offsetWidth;
  card.classList.add("flash");
  showToast(ok ? `${item.prompt} ${NAI_EMBEDDED ? "삽입됨" : "복사됨"}` : "복사에 실패했답니다.");
}

function bindPressable(element,type,index,onClick) {
  let timer = null;
  let startX = 0;
  let startY = 0;
  let longPressed = false;
  let suppressClick = false;

  const cancelTimer = () => {
    if (timer) clearTimeout(timer);
    timer = null;
  };

  element.addEventListener("click", e => {
    if (suppressClick || longPressed) {
      e.preventDefault();
      e.stopPropagation();
      suppressClick = false;
      longPressed = false;
      return;
    }
    onClick?.(e);
  });

  element.addEventListener("contextmenu", e => {
    e.preventDefault();
    cancelTimer();
    suppressClick = true;
    openContextMenu(type,index,e.clientX,e.clientY);
    setTimeout(() => { suppressClick = false; }, 450);
  });

  element.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse") return;
    startX = e.clientX;
    startY = e.clientY;
    longPressed = false;
    cancelTimer();
    timer = setTimeout(() => {
      longPressed = true;
      suppressClick = true;
      if (navigator.vibrate) navigator.vibrate(12);
      openContextMenu(type,index,startX,startY);
      setTimeout(() => { suppressClick = false; longPressed = false; }, 650);
    }, 520);
  }, {passive:true});

  element.addEventListener("pointermove", e => {
    if (Math.hypot(e.clientX - startX,e.clientY - startY) > 12) cancelTimer();
  }, {passive:true});
  element.addEventListener("pointerup", cancelTimer, {passive:true});
  element.addEventListener("pointercancel", cancelTimer, {passive:true});
}

async function copyText(text) {
  if (NAI_EMBEDDED) {
    window.parent.postMessage({ source: NAI_BRIDGE_SOURCE, type: "insert", text: String(text ?? ""), tab: activeTab }, "*");
    return true;
  }

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {}

  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();

  let ok = false;
  try { ok = document.execCommand("copy"); } catch {}
  ta.remove();
  return ok;
}

async function copyArtist(i,row) {
  const text = "artist:" + data.artists[i].name;
  const ok = await copyText(text);
  row.classList.remove("flash");
  void row.offsetWidth;
  row.classList.add("flash");
  showToast(ok ? `${text} ${NAI_EMBEDDED ? "삽입됨" : "복사됨"}` : "복사에 실패했답니다.");
}

async function copyAction(i,card) {
  const text = data.actions[i].prompt;
  const ok = await copyText(text);
  card.classList.remove("flash");
  void card.offsetWidth;
  card.classList.add("flash");
  showToast(ok ? `${data.actions[i].title} 프롬프트 ${NAI_EMBEDDED ? "삽입됨" : "복사됨"}` : "복사에 실패했답니다.");
}

function openContextMenu(type,index,x,y) {
  targetType = type;
  targetIndex = index;
  const item = type === "artist" ? data.artists[index] : type === "action" ? data.actions[index] : data.tags[index];
  if (!item) return;

  document.getElementById("pinBtn").textContent = item.pinned ? "고정 해제" : "상단에 고정";
  document.getElementById("duplicateBtn").style.display = (type === "action" || type === "tag") ? "" : "none";
  menu.classList.add("show");

  requestAnimationFrame(() => {
    if (matchMedia("(max-width: 600px)").matches) {
      menu.style.left = "10px";
      menu.style.right = "10px";
      menu.style.top = "auto";
      menu.style.bottom = "calc(10px + env(safe-area-inset-bottom))";
      return;
    }
    const r = menu.getBoundingClientRect();
    menu.style.right = "auto";
    menu.style.bottom = "auto";
    menu.style.left = Math.max(8,Math.min(x,innerWidth - r.width - 8)) + "px";
    menu.style.top = Math.max(8,Math.min(y,innerHeight - r.height - 8)) + "px";
  });
}

function hideMenu() {
  menu.classList.remove("show");

    i !== artistEditIndex && item.name.toLowerCase() === name.toLowerCase()
  );

    e.preventDefault();
    showToast("같은 작가명이 이미 있답니다.");
    return;
  }

  if (artistEditIndex >= 0) {
    data.artists[artistEditIndex].name = name;

});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove("show"),1400);
}


function exportBackup() {
  const payload = {
    app: "Artist / Tag Quick Copy",
    version: 7,
    exportedAt: new Date().toISOString(),
    data: {
      artists: data.artists.map(item => ({...item})),
      actions: data.actions.map(item => ({...item})),
      tags: data.tags.map(item => ({...item}))
    }
  };

  const blob = new Blob(
    [JSON.stringify(payload, null, 2)],
    {type: "application/json;charset=utf-8"}
  );

  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}`;
  const filename = `artist_tag_quickcopy_backup_${stamp}.json`;

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  showToast("전체 데이터를 JSON으로 백업했답니다.");
}

function parseImportedBackup(raw) {
  let parsed;
  try {
    parsed = JSON.parse(raw);
  } catch {
    throw new Error("JSON 형식이 올바르지 않답니다.");
  }

  // v5 backup envelope
  if (parsed && typeof parsed === "object" && parsed.data) {
    parsed = parsed.data;
  }

  // Allow direct v4/v5 data object
  if (parsed && typeof parsed === "object" && Array.isArray(parsed.artists) && Array.isArray(parsed.actions)) {
    const artists = parsed.artists
      .map(normalizeArtist)
      .filter(x => x && x.name);

    const actions = parsed.actions
      .map(normalizeAction)
      .filter(x => x && x.title && x.prompt);

    const tags = Array.isArray(parsed.tags)
      ? parsed.tags.map(normalizeTag).filter(x => x && x.title && x.prompt)
      : DEFAULT_TAGS.map(x => ({...x}));

    return {artists, actions, tags};
  }

  // Allow legacy artist-array backups
  if (Array.isArray(parsed)) {
    const artists = parsed
      .map(normalizeArtist)
      .filter(x => x && x.name);

    return {artists, actions:[], tags:DEFAULT_TAGS.map(x => ({...x}))};
  }

  throw new Error("이 앱의 백업 파일 형식이 아니랍니다.");
}

let pendingImport = null;

function mergeImportedData(imported, duplicatePolicy) {
  const merged = {
    artists: data.artists.map(item => ({...item})),
    actions: data.actions.map(item => ({...item})),
    tags: data.tags.map(item => ({...item}))
  };

  const artistIndex = new Map(
    merged.artists.map((item, i) => [item.name.trim().toLowerCase(), i])
  );

  for (const importedArtist of imported.artists) {
    const key = importedArtist.name.trim().toLowerCase();
    if (!artistIndex.has(key)) {
      artistIndex.set(key, merged.artists.length);
      merged.artists.push({...importedArtist});
    } else if (duplicatePolicy === "overwrite") {
      merged.artists[artistIndex.get(key)] = {...importedArtist};
    }
  }

  const actionKey = item =>
    `${item.title.trim().toLowerCase()}|||${item.prompt.trim().toLowerCase()}`;

  const actionIndex = new Map(
    merged.actions.map((item, i) => [actionKey(item), i])
  );

  for (const importedAction of imported.actions) {
    const key = actionKey(importedAction);
    if (!actionIndex.has(key)) {
      actionIndex.set(key, merged.actions.length);
      merged.actions.push({...importedAction});
    } else if (duplicatePolicy === "overwrite") {
      merged.actions[actionIndex.get(key)] = {...importedAction};
    }
  }


  const tagKey = item => item.prompt.trim().toLowerCase();
  const tagIndex = new Map(
    merged.tags.map((item, i) => [tagKey(item), i])
  );
  for (const importedTag of imported.tags) {
    const key = tagKey(importedTag);
    if (!tagIndex.has(key)) {
      tagIndex.set(key, merged.tags.length);
      merged.tags.push({...importedTag});
    } else if (duplicatePolicy === "overwrite") {
      merged.tags[tagIndex.get(key)] = {...importedTag};
    }
  }

  return merged;
}

function updateImportModeUI() {
  const mode = document.querySelector('input[name="importMode"]:checked')?.value || "replace";
  document.getElementById("duplicatePolicyField").style.display =
    mode === "merge" ? "" : "none";
}

function openImportDialog(imported) {
  pendingImport = imported;

  document.getElementById("importSummary").innerHTML =
    `백업 내용: <strong>작가 ${imported.artists.length}명</strong> · ` +
    `<strong>행동 프롬프트 ${imported.actions.length}개</strong> · ` +
    `<strong>태그 ${imported.tags.length}개</strong>`;

  const replaceRadio = document.querySelector('input[name="importMode"][value="replace"]');
  if (replaceRadio) replaceRadio.checked = true;

  updateImportModeUI();
  document.getElementById("importDialog").showModal();
}

async function importBackupFile(file) {
  if (!file) return;

  let raw;
  try {
    raw = await file.text();
  } catch {
    showToast("백업 파일을 읽지 못했답니다.");
    return;
  }

  let imported;
  try {
    imported = parseImportedBackup(raw);
  } catch (err) {
    alert(err.message || "백업 파일을 불러오지 못했답니다.");
    return;
  }

  openImportDialog(imported);
}

document.querySelectorAll('input[name="importMode"]').forEach(input => {
  input.addEventListener("change", updateImportModeUI);
});

document.getElementById("cancelImportBtn").addEventListener("click", () => {
  pendingImport = null;
  document.getElementById("importDialog").close();
});

document.getElementById("confirmImportBtn").addEventListener("click", () => {
  if (!pendingImport) return;

  const mode = document.querySelector('input[name="importMode"]:checked')?.value || "replace";
  const duplicatePolicy = document.getElementById("duplicatePolicy").value;

  if (mode === "replace") {
    data = {
      artists: pendingImport.artists.map(item => ({...item})),
      actions: pendingImport.actions.map(item => ({...item})),
      tags: pendingImport.tags.map(item => ({...item}))
    };
  } else {
    data = mergeImportedData(pendingImport, duplicatePolicy);
  }

  const artistCount = data.artists.length;
  const actionCount = data.actions.length;
  const tagCount = data.tags.length;

  persist();
  pendingImport = null;

  searchText = "";
  searchInput.value = "";
  activeCategory = "전체";
  comboMode = false;
  comboSelection.clear();

  document.getElementById("importDialog").close();
  render();

  showToast(
    mode === "merge"
      ? `병합 완료 · 작가 ${artistCount}명 · 행동 ${actionCount}개 · 태그 ${tagCount}개`
      : `복원 완료 · 작가 ${artistCount}명 · 행동 ${actionCount}개 · 태그 ${tagCount}개`
  );
});

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function escapeAttr(value) {
  return escapeHtml(value);
}

render();
