name: Chat Agent - Windows

on:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-agent-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Run on local Windows PC
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Environment check
        shell: cmd
        run: |
          git status --short
          node --version
          npm --version
          cargo --version
          rustc --version

      - name: Prepare Android environment
        timeout-minutes: 5
        shell: cmd
        run: |
          if not defined JAVA_HOME set "JAVA_HOME=C:\Program Files\Eclipse Adoptium\jdk-17.0.20.8-hotspot"
          if not defined ANDROID_HOME set "ANDROID_HOME=C:\Android\sdk"
          if not exist "%JAVA_HOME%\bin\java.exe" exit /b 19
          if not exist "%ANDROID_HOME%" exit /b 20
          if not defined NDK_HOME for /f "delims=" %%D in ('dir /b /ad /o-n "%ANDROID_HOME%\ndk" 2^>nul') do if not defined NDK_HOME set "NDK_HOME=%ANDROID_HOME%\ndk\%%D"
          if not defined NDK_HOME exit /b 21
          if not exist "%NDK_HOME%" exit /b 22
          echo JAVA_HOME=%JAVA_HOME%
          echo ANDROID_HOME=%ANDROID_HOME%
          echo NDK_HOME=%NDK_HOME%
          "%JAVA_HOME%\bin\java.exe" -version
          dir /b "%ANDROID_HOME%\ndk"
          echo JAVA_HOME=%JAVA_HOME%>>"%GITHUB_ENV%"
          echo ANDROID_HOME=%ANDROID_HOME%>>"%GITHUB_ENV%"
          echo ANDROID_SDK_ROOT=%ANDROID_HOME%>>"%GITHUB_ENV%"
          echo NDK_HOME=%NDK_HOME%>>"%GITHUB_ENV%"
          echo ANDROID_NDK_HOME=%NDK_HOME%>>"%GITHUB_ENV%"
          echo %JAVA_HOME%\bin>>"%GITHUB_PATH%"
          echo %ANDROID_HOME%\platform-tools>>"%GITHUB_PATH%"

      - name: Install Node dependencies
        timeout-minutes: 10
        shell: cmd
        run: npm ci

      - name: Frontend build
        timeout-minutes: 10
        shell: cmd
        run: npm run build

      - name: Rust tests
        timeout-minutes: 20
        shell: cmd
        run: cargo test --manifest-path src-tauri\Cargo.toml

      - name: Android build
        timeout-minutes: 30
        shell: cmd
        run: npm run android:build

      - name: Upload frontend build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: dist/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Android packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-packages-${{ github.run_id }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: ignore
          retention-days: 7
