name: Chat Agent - Windows

on:
  push:
    branches:
      - "agent/**"
    paths-ignore:
      - ".agent/request.json"
      - ".agent/run-command.ps1"
      - ".github/workflows/chat-command-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-agent-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Run on local Windows PC
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Environment check
        shell: cmd
        run: |
          git status --short
          node --version
          npm --version
          cargo --version
          rustc --version

      - name: Prepare Android environment
        timeout-minutes: 25
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .agent\setup-android.ps1

      - name: Install Node dependencies
        timeout-minutes: 10
        shell: cmd
        run: npm ci

      - name: Prepare app icons
        timeout-minutes: 5
        shell: cmd
        run: |
          node scripts\prepare-app-icon.mjs
          npm run tauri -- icon src-tauri\icons\nai-v5-studio-source.png

      - name: Frontend build
        timeout-minutes: 10
        shell: cmd
        run: npm run build

      - name: Android ARM64 debug APK
        timeout-minutes: 20
        shell: cmd
        run: npm run tauri -- android build --debug --apk --target aarch64

      - name: Rust tests
        timeout-minutes: 20
        shell: cmd
        run: cargo test --manifest-path src-tauri\Cargo.toml

      - name: Upload frontend build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: dist/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Android APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_id }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
          retention-days: 7
