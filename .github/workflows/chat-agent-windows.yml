name: Chat Agent - Windows

on:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-agent-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Run on local Windows PC
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Environment check
        shell: cmd
        run: |
          git status --short
          node --version
          npm --version
          cargo --version
          rustc --version

      - name: Install Node dependencies
        shell: cmd
        run: npm ci

      - name: Frontend build
        shell: cmd
        run: npm run build

      - name: Rust tests
        shell: cmd
        run: cargo test --manifest-path src-tauri\Cargo.toml

      - name: Upload frontend build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: dist/**
          if-no-files-found: ignore
          retention-days: 7
