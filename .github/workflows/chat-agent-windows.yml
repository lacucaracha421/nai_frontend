name: Chat Agent - Windows

on:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-agent-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Run on local Windows PC
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Environment check
        shell: cmd
        run: |
          git status --short
          node --version
          npm --version
          cargo --version
          rustc --version

      - name: Android tool discovery
        timeout-minutes: 3
        shell: cmd
        run: |
          echo Existing JAVA_HOME=%JAVA_HOME%
          echo Existing ANDROID_HOME=%ANDROID_HOME%
          echo Existing ANDROID_SDK_ROOT=%ANDROID_SDK_ROOT%
          echo Existing NDK_HOME=%NDK_HOME%
          where java 2>nul || echo [probe] java not on PATH
          where javac 2>nul || echo [probe] javac not on PATH
          where adb 2>nul || echo [probe] adb not on PATH
          where sdkmanager 2>nul || echo [probe] sdkmanager not on PATH
          if exist "C:\Program Files\Android\Android Studio\jbr\bin\java.exe" echo [probe] Android Studio JBR=C:\Program Files\Android\Android Studio\jbr
          if exist "C:\Program Files\Android\Android Studio\jre\bin\java.exe" echo [probe] Android Studio JRE=C:\Program Files\Android\Android Studio\jre
          if exist "C:\Program Files\Java\jdk-17\bin\java.exe" echo [probe] JDK17=C:\Program Files\Java\jdk-17
          if exist "%LOCALAPPDATA%\Android\Sdk\platform-tools\adb.exe" echo [probe] SDK=%LOCALAPPDATA%\Android\Sdk
          if exist "C:\Android\Sdk\platform-tools\adb.exe" echo [probe] SDK=C:\Android\Sdk
          if exist "D:\Android\Sdk\platform-tools\adb.exe" echo [probe] SDK=D:\Android\Sdk
          dir /b "C:\Program Files\Android" 2>nul || echo [probe] no C:\Program Files\Android
          dir /b "%LOCALAPPDATA%\Android" 2>nul || echo [probe] no %%LOCALAPPDATA%%\Android
          dir /b "C:\Android" 2>nul || echo [probe] no C:\Android
          dir /b "D:\Android" 2>nul || echo [probe] no D:\Android

      - name: Android environment check
        timeout-minutes: 5
        shell: cmd
        run: |
          set "JAVA_HOME=C:\Program Files\Java\jdk-17"
          set "ANDROID_HOME=%LOCALAPPDATA%\Android\Sdk"
          set "ANDROID_SDK_ROOT=%LOCALAPPDATA%\Android\Sdk"
          set "NDK_HOME=%LOCALAPPDATA%\Android\Sdk\ndk\30.0.15729638"
          set "PATH=C:\Program Files\nodejs;%USERPROFILE%\.cargo\bin;%JAVA_HOME%\bin;%ANDROID_HOME%\platform-tools;%PATH%"
          echo JAVA_HOME=%JAVA_HOME%
          echo ANDROID_HOME=%ANDROID_HOME%
          echo NDK_HOME=%NDK_HOME%
          if not exist "%JAVA_HOME%\bin\java.exe" exit /b 19
          if not exist "%ANDROID_HOME%" exit /b 20
          if not exist "%NDK_HOME%" exit /b 21
          "%JAVA_HOME%\bin\java.exe" -version

      - name: Install Node dependencies
        timeout-minutes: 10
        shell: cmd
        run: npm ci

      - name: Frontend build
        timeout-minutes: 10
        shell: cmd
        run: npm run build

      - name: Rust tests
        timeout-minutes: 20
        shell: cmd
        run: cargo test --manifest-path src-tauri\Cargo.toml

      - name: Android build
        timeout-minutes: 30
        shell: cmd
        run: |
          set "JAVA_HOME=C:\Program Files\Java\jdk-17"
          set "ANDROID_HOME=%LOCALAPPDATA%\Android\Sdk"
          set "ANDROID_SDK_ROOT=%LOCALAPPDATA%\Android\Sdk"
          set "NDK_HOME=%LOCALAPPDATA%\Android\Sdk\ndk\30.0.15729638"
          set "PATH=C:\Program Files\nodejs;%USERPROFILE%\.cargo\bin;%JAVA_HOME%\bin;%ANDROID_HOME%\platform-tools;%PATH%"
          npm run android:build

      - name: Upload frontend build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: dist/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Android packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-packages-${{ github.run_id }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: ignore
          retention-days: 7
