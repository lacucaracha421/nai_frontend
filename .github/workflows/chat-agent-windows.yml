name: Chat Agent - Windows

on:
  push:
    branches:
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-agent-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Run on local Windows PC
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Environment check
        shell: cmd
        run: |
          git status --short
          node --version
          npm --version
          cargo --version
          rustc --version

      - name: Prepare Android environment
        timeout-minutes: 25
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .agent\setup-android.ps1

      - name: Install Node dependencies
        timeout-minutes: 10
        shell: cmd
        run: npm ci

      - name: Frontend build
        timeout-minutes: 10
        shell: cmd
        run: npm run build

      - name: Android build
        timeout-minutes: 40
        shell: cmd
        run: npm run android:build

      - name: Rust tests
        timeout-minutes: 20
        shell: cmd
        run: cargo test --manifest-path src-tauri\Cargo.toml

      - name: Upload frontend build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: dist/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Android packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-packages-${{ github.run_id }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: ignore
          retention-days: 7
