name: Chat Command - Windows

on:
  push:
    branches:
      - "agent/**"
    paths:
      - ".agent/request.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-command-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  command:
    name: Execute Chat command on Laku-PC
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Show request
        shell: cmd
        run: type .agent\request.json

      - name: Execute request
        timeout-minutes: 31
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .agent\run-command.ps1

      - name: Upload command result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-command-result-${{ github.run_id }}
          path: .agent/out/**
          if-no-files-found: warn
          retention-days: 7
